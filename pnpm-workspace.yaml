packages:
  - apps/*
  - packages/*
  - e2e

allowBuilds:
  "@parcel/watcher": true

# Libraries resolve `react` types from the root (react-aria render props become `any` otherwise)
publicHoistPattern:
  - '@types/react'
  - '@types/react-dom'

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@infrajo/*'
